<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGradSM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192128"/>
      <stop offset="50%" stop-color="#11161b"/>
      <stop offset="100%" stop-color="#0a0d0f"/>
    </linearGradient>
    <radialGradient id="goldGlowSM" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c9b8a0" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#c9b8a0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0d0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBorderSM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfd3c3"/>
      <stop offset="50%" stop-color="#c9b8a0"/>
      <stop offset="100%" stop-color="#735c3f"/>
    </linearGradient>
    <linearGradient id="silhouetteGradSM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323c46"/>
      <stop offset="100%" stop-color="#161c22"/>
    </linearGradient>
    <linearGradient id="badgeGradSM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9b8a0"/>
      <stop offset="100%" stop-color="#937a5b"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGradSM)"/>
  <rect width="400" height="400" fill="url(#goldGlowSM)"/>

  <!-- Backend Data Nodes & Server Flow Motif -->
  <g stroke="#c9b8a0" stroke-opacity="0.12" stroke-width="1.2">
    <!-- Concentric Server Circles -->
    <circle cx="200" cy="180" r="130" fill="none" stroke-dasharray="6 6"/>
    <circle cx="200" cy="180" r="115" fill="none" stroke-opacity="0.2"/>
    <!-- Node Network Lines -->
    <line x1="60" y1="120" x2="140" y2="160"/>
    <line x1="340" y1="120" x2="260" y2="160"/>
    <line x1="60" y1="240" x2="140" y2="200"/>
    <line x1="340" y1="240" x2="260" y2="200"/>
  </g>
  <g fill="#c9b8a0" fill-opacity="0.25">
    <circle cx="60" cy="120" r="4"/>
    <circle cx="340" cy="120" r="4"/>
    <circle cx="60" cy="240" r="4"/>
    <circle cx="340" cy="240" r="4"/>
    <circle cx="140" cy="160" r="3"/>
    <circle cx="260" cy="160" r="3"/>
  </g>

  <!-- Executive Silhouette Portrait -->
  <g>
    <!-- Shoulders & Torso -->
    <path d="M 90 380 C 95 310, 140 270, 200 270 C 260 270, 305 310, 310 380 Z" fill="url(#silhouetteGradSM)"/>
    <!-- Suit Collar / Lapels -->
    <path d="M 175 270 L 200 325 L 225 270 Z" fill="#1e252d"/>
    <path d="M 200 325 L 200 380" stroke="#c9b8a0" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Neck -->
    <path d="M 182 230 L 218 230 L 214 275 L 186 275 Z" fill="#323c46"/>
    <!-- Head -->
    <ellipse cx="200" cy="175" rx="55" ry="68" fill="url(#silhouetteGradSM)"/>
    <!-- Clean Structured Hair Contour -->
    <path d="M 144 165 C 142 110, 168 94, 200 94 C 232 94, 256 110, 256 165 C 248 135, 222 120, 200 120 C 176 120, 152 135, 144 165 Z" fill="#44515e"/>
  </g>

  <!-- CTO Monogram Shield Overlay -->
  <g transform="translate(200, 340)">
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#14191e" stroke="url(#goldBorderSM)" stroke-width="1.5"/>
    <circle cx="-42" cy="0" r="10" fill="url(#badgeGradSM)"/>
    <text x="-42" y="4" font-family="'Outfit', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#0f1316" text-anchor="middle">SM</text>
    <text x="12" y="4" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#e0d3c1" text-anchor="middle">CTO</text>
  </g>

  <!-- Inner Border Frame -->
  <rect x="1" y="1" width="398" height="398" rx="15" fill="none" stroke="url(#goldBorderSM)" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
