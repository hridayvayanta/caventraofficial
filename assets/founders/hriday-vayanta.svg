<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2127"/>
      <stop offset="50%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#0a0d0f"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c9b8a0" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#c9b8a0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0d0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfd3c3"/>
      <stop offset="50%" stop-color="#c9b8a0"/>
      <stop offset="100%" stop-color="#735c3f"/>
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#323b44"/>
      <stop offset="100%" stop-color="#161c22"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9b8a0"/>
      <stop offset="100%" stop-color="#937a5b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <rect width="400" height="400" fill="url(#goldGlow)"/>

  <!-- Architectural Grid / Tech Lines (Background Motif for Lead Architect) -->
  <g stroke="#c9b8a0" stroke-opacity="0.08" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
  </g>

  <!-- Outer Elegant Halo -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  <circle cx="200" cy="180" r="115" fill="none" stroke="#c9b8a0" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Executive Silhouette Portrait -->
  <g>
    <!-- Shoulders & Torso -->
    <path d="M 90 380 C 95 310, 140 270, 200 270 C 260 270, 305 310, 310 380 Z" fill="url(#silhouetteGrad)"/>
    <!-- Suit Collar / Lapels -->
    <path d="M 175 270 L 200 325 L 225 270 Z" fill="#1e252d"/>
    <path d="M 200 325 L 200 380" stroke="#c9b8a0" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Neck -->
    <path d="M 182 230 L 218 230 L 214 275 L 186 275 Z" fill="#323b44"/>
    <!-- Head -->
    <ellipse cx="200" cy="175" rx="55" ry="68" fill="url(#silhouetteGrad)"/>
    <!-- Clean Hair Contour -->
    <path d="M 142 165 C 142 110, 165 95, 200 95 C 235 95, 258 110, 258 165 C 250 135, 220 120, 200 120 C 175 120, 150 135, 142 165 Z" fill="#44505c"/>
  </g>

  <!-- Architect Monogram Shield Overlay -->
  <g transform="translate(200, 340)">
    <!-- Shield pill -->
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#14191e" stroke="url(#goldBorder)" stroke-width="1.5"/>
    <circle cx="-42" cy="0" r="10" fill="url(#badgeGrad)"/>
    <text x="-42" y="4" font-family="'Outfit', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#0f1316" text-anchor="middle">HV</text>
    <text x="12" y="4" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#e0d3c1" text-anchor="middle">ARCHITECT</text>
  </g>

  <!-- Inner Border Frame -->
  <rect x="1" y="1" width="398" height="398" rx="15" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
