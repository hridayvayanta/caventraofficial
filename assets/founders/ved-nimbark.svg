<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGradVN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2026"/>
      <stop offset="50%" stop-color="#13171b"/>
      <stop offset="100%" stop-color="#0a0d0f"/>
    </linearGradient>
    <radialGradient id="goldGlowVN" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c9b8a0" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#c9b8a0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0d0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBorderVN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfd3c3"/>
      <stop offset="50%" stop-color="#c9b8a0"/>
      <stop offset="100%" stop-color="#735c3f"/>
    </linearGradient>
    <linearGradient id="silhouetteGradVN" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#343d47"/>
      <stop offset="100%" stop-color="#171d23"/>
    </linearGradient>
    <linearGradient id="badgeGradVN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9b8a0"/>
      <stop offset="100%" stop-color="#937a5b"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGradVN)"/>
  <rect width="400" height="400" fill="url(#goldGlowVN)"/>

  <!-- Design Systems / Typography Curves (Background Motif for UI/UX Lead) -->
  <g stroke="#c9b8a0" stroke-opacity="0.1" stroke-width="1.2" fill="none">
    <circle cx="200" cy="180" r="140" stroke-dasharray="4 8"/>
    <path d="M 40 180 Q 200 40 360 180"/>
    <path d="M 40 220 Q 200 360 360 220"/>
    <circle cx="200" cy="180" r="115" stroke-opacity="0.2"/>
    <!-- UI Layout Guides -->
    <rect x="70" y="70" width="260" height="260" rx="8" stroke-dasharray="3 5" stroke-opacity="0.08"/>
  </g>

  <!-- Executive Silhouette Portrait -->
  <g>
    <!-- Shoulders & Torso -->
    <path d="M 90 380 C 95 310, 140 270, 200 270 C 260 270, 305 310, 310 380 Z" fill="url(#silhouetteGradVN)"/>
    <!-- Suit Collar / Lapels -->
    <path d="M 175 270 L 200 325 L 225 270 Z" fill="#1e252d"/>
    <path d="M 200 325 L 200 380" stroke="#c9b8a0" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Neck -->
    <path d="M 182 230 L 218 230 L 214 275 L 186 275 Z" fill="#343d47"/>
    <!-- Head -->
    <ellipse cx="200" cy="175" rx="55" ry="68" fill="url(#silhouetteGradVN)"/>
    <!-- Stylish Modern Creative Hair Contour -->
    <path d="M 140 170 C 138 105, 170 90, 205 90 C 240 90, 260 108, 258 170 C 248 130, 225 115, 200 115 C 170 115, 148 135, 140 170 Z" fill="#465360"/>
  </g>

  <!-- Design Lead Monogram Shield Overlay -->
  <g transform="translate(200, 340)">
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#14191e" stroke="url(#goldBorderVN)" stroke-width="1.5"/>
    <circle cx="-42" cy="0" r="10" fill="url(#badgeGradVN)"/>
    <text x="-42" y="4" font-family="'Outfit', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#0f1316" text-anchor="middle">VN</text>
    <text x="12" y="4" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#e0d3c1" text-anchor="middle">UI / UX LEAD</text>
  </g>

  <!-- Inner Border Frame -->
  <rect x="1" y="1" width="398" height="398" rx="15" fill="none" stroke="url(#goldBorderVN)" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
